<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentes Virtuais — Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-interno">
      <span class="logo">Agentes Virtuais</span>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="agentes.html">Agentes</a></li>
          <li><a href="cadastro.html" class="ativo">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <h1 class="titulo-pagina">Cadastro de agente</h1>

    <form class="formulario" action="#" method="post">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="campo">
        <label for="especialidade">Especialidade</label>
        <input type="text" id="especialidade" name="especialidade" required>
      </div>

      <div class="campo">
        <label for="tarefa">Tarefa</label>
        <textarea id="tarefa" name="tarefa" rows="4" required></textarea>
      </div>

      <div class="campo">
        <label for="responsavel">Responsável pelo assistente</label>
        <input type="text" id="responsavel" name="responsavel" required>
      </div>

      <div class="campo">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" name="matricula"
               pattern="[0-9]+" title="Digite apenas números" required>
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </main>

  <footer class="rodape">
    <p>Sistema de Cadastro de Agentes Virtuais</p>
  </footer>
</body>
</html>
